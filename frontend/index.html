<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Order Management System</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        /* background: rgb(0, 65, 187); matches LoadingOverlay background */
      }

      /* ── Static pre-mount loader ─────────────────────────────
         Lives inside #root, so React's createRoot(...).render()
         replaces it automatically the instant the app mounts —
         no flash, no manual removal needed. Markup/CSS mirrors
         src/components/Loader.jsx exactly so the handoff is seamless. */

      #pre-loader-overlay {
        position: fixed;
        inset: 0;
        background: rgb(0, 65, 187);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .mpi-loader { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
      .mpi-loader__ring {
        position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,0.9) 300deg, rgba(255,255,255,0) 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        animation: mpiSpin 1.1s linear infinite;
      }
      .mpi-loader__tile {
        width: 92px; height: 92px; border-radius: 24px; display: grid; place-items: center;
        background: rgba(255,255,255,0.96);
        box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 20px 40px -12px rgba(0,0,0,0.45);
        animation: mpiBreathe 2.2s cubic-bezier(0.4,0,0.2,1) infinite;
      }
      .mpi-loader__tile img { width: 68px; height: auto; object-fit: contain; }
      .mpi-loader__bar { position: absolute; bottom: -28px; width: 96px; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.22); overflow: hidden; }
      .mpi-loader__bar span { display: block; width: 40%; height: 100%; border-radius: 3px; background: #fff; animation: mpiSweep 1.2s cubic-bezier(0.4,0,0.2,1) infinite; }
      @keyframes mpiSpin { to { transform: rotate(360deg); } }
      @keyframes mpiBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes mpiSweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="pre-loader-overlay" aria-hidden="true">
        <div aria-label="Loading" role="img" class="mpi-loader">
          <div class="mpi-loader__ring"></div>
          <div class="mpi-loader__tile"><img src="Logo.png" alt="" /></div>
          <div class="mpi-loader__bar"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
